# Render Blueprint — deploys the backend API only. The database lives on
# Neon (see .ai/DEPLOYMENT.md for why), and the frontend deploys separately
# on Vercel, so neither is declared here.
#
# Usage: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file and creates the service below; it does not create anything not
# listed here.
services:
  - type: web
    name: citadel-api
    runtime: node
    repo: https://github.com/Ayush-o1/citadel.git
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      # PORT is provided by Render at runtime; the app already reads
      # process.env.PORT (see server/src/config/env.js) so it's not set here.
      #
      # Listed here (all sync: false, no values committed) so Render's
      # Blueprint setup actually prompts for them, instead of a deployer
      # only discovering they're needed by reading DEPLOYMENT.md after
      # Google Sign-In mysteriously doesn't work. See DEPLOYMENT.md for
      # what each one needs to be set to.
